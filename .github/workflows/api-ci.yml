name: API CI

on:
  push:
    branches: [ main, develop ]
    paths: [ 'api/**', 'core/**', 'storage/**', 'tests/**', 'pyproject.toml', 'requirements.txt', 'docs/**', 'mkdocs.yml' ]
  pull_request:
    branches: [ main, develop ]
    paths: [ 'api/**', 'core/**', 'storage/**', 'tests/**', 'pyproject.toml', 'requirements.txt', 'docs/**', 'mkdocs.yml' ]

jobs:
  lint:
    name: Lint with Ruff
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-lint-${{ hashFiles('requirements-dev.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-lint-
          ${{ runner.os }}-pip-

    - name: Verify lockfiles are in sync
      run: |
        python -m pip install --upgrade pip pip-tools
        pip-compile requirements.in --dry-run --quiet --output-file=/tmp/requirements-check.txt
        if ! diff -q requirements.txt /tmp/requirements-check.txt > /dev/null 2>&1; then
          echo "❌ ERROR: requirements.txt is out of sync with requirements.in"
          echo "Run: pip-compile requirements.in --generate-hashes"
          exit 1
        fi
        echo "✅ Lockfiles are in sync"

    - name: Install dependencies from lockfile
      run: |
        python -m pip install --upgrade pip
        pip install ruff

    - name: Run Ruff linter (fail on any issues)
      run: |
        # Check for linting issues - fails on any violation
        ruff check . --no-fix --exit-non-zero-on-fix

    - name: Run Ruff formatter check (fail on any formatting issues)
      run: |
        # Check formatting - fails if any files need formatting
        ruff format --check .

  type-check:
    name: Type Check with Mypy
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-mypy-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-mypy-
          ${{ runner.os }}-pip-

    - name: Install dependencies from lockfile
      run: |
        python -m pip install --upgrade pip
        pip install --require-hashes -r requirements.txt
        pip install --require-hashes -r requirements-dev.txt
        pip install -e . --no-deps

    - name: Run Mypy type checking (fail on warnings)
      run: |
        # Mypy configured in pyproject.toml with strict settings
        # Will fail on any type errors or warnings
        mypy api/ core/ storage/ --strict --warn-unused-ignores --warn-redundant-casts --warn-return-any

  security:
    name: Security Audit with pip-audit
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-audit-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-audit-
          ${{ runner.os }}-pip-

    - name: Install pip-audit
      run: |
        python -m pip install --upgrade pip pip-audit

    - name: Run pip-audit on lockfile (fail on vulnerabilities)
      run: |
        # Audit lockfile with hash verification for known vulnerabilities
        # Fails if any vulnerabilities are found
        pip-audit --require-hashes --requirement requirements.txt --strict --desc

  docs-build:
    name: Build Documentation with MkDocs
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-mkdocs-${{ hashFiles('requirements-dev.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-mkdocs-
          ${{ runner.os }}-pip-

    - name: Install MkDocs from lockfile
      run: |
        python -m pip install --upgrade pip
        pip install --require-hashes -r requirements-dev.txt

    - name: Build documentation (fail on warnings)
      run: |
        # Build docs with strict mode - fails on any warnings or errors
        mkdocs build --strict --verbose

    - name: Upload documentation artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mkdocs-site
        path: site/

  test:
    name: Test with Pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ matrix.python-version }}-
          ${{ runner.os }}-pip-

    - name: Install dependencies from lockfile
      run: |
        python -m pip install --upgrade pip
        pip install --require-hashes -r requirements.txt
        pip install --require-hashes -r requirements-dev.txt
        pip install -e . --no-deps

    - name: Set up test database
      env:
        LORIEN_DB_PATH: /tmp/test_lorien_${{ matrix.python-version }}.db
      run: |
        python -c "import os; from storage.sqlite import SQLiteRepository; db_path = os.environ['LORIEN_DB_PATH']; SQLiteRepository(db_path=db_path); print(f'Test database initialized at {db_path}')"

    - name: Run tests with Pytest (fail on warnings)
      env:
        LORIEN_DB_PATH: /tmp/test_lorien_${{ matrix.python-version }}.db
      run: |
        # Run pytest with warnings as errors
        pytest -q --strict-warnings --strict-markers --strict-config \
          --junitxml=junit-${{ matrix.python-version }}.xml \
          --cov=api --cov=core --cov=storage \
          --cov-report=xml --cov-report=term-missing

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.python-version }}
        path: |
          junit-${{ matrix.python-version }}.xml
          coverage.xml

  wiring-audit:
    name: Wiring Audit
    runs-on: ubuntu-latest
    needs: [lint, type-check, test]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-audit-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-audit-
          ${{ runner.os }}-pip-

    - name: Install dependencies from lockfile
      run: |
        python -m pip install --upgrade pip
        pip install --require-hashes -r requirements.txt
        pip install --require-hashes -r requirements-dev.txt
        pip install -e . --no-deps

    - name: Run wiring audit
      env:
        ANALYTICS_ENABLED: "true"
        LORIEN_DB_PATH: /tmp/test_audit.db
      run: |
        python tools/audit/wiring_audit.py > audit_report.json
        python tools/audit/scan_backend.py > backend_routes.json
        python tools/audit/scan_flutter.py > flutter_scan.json

    - name: Check dual-mount coverage
      run: |
        python -c "
        import json
        with open('audit_report.json') as f:
            report = json.load(f)

        # Check that all required endpoints have dual mount
        missing_dual = []
        for route, info in report.get('dual_mount_analysis', {}).items():
            if not (info.get('bare', False) and info.get('v1', False)):
                missing_dual.append(route)

        if missing_dual:
            print(f'ERROR: Missing dual mount for routes: {missing_dual}')
            exit(1)
        else:
            print('SUCCESS: All routes have dual mount coverage')
        "

    - name: Check header SoT (Single Source of Truth)
      run: |
        # Check that the frozen 8-column header appears exactly once as canonical
        header_count=$(grep -r "Vital Measurement,Node 1,Node 2,Node 3,Node 4,Node 5,Diagnostic Triage,Actions" . --include="*.py" --include="*.md" | wc -l)
        if [ "$header_count" -ne 1 ]; then
          echo "ERROR: Frozen header should appear exactly once as canonical (found $header_count times)"
          exit 1
        else
          echo "SUCCESS: Frozen header appears exactly once as canonical"
        fi

    - name: Upload audit artifacts
      uses: actions/upload-artifact@v4
      with:
        name: audit-artifacts
        path: |
          audit_report.json
          backend_routes.json
          flutter_scan.json

  # Final status check - all jobs must pass
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [lint, type-check, security, docs-build, test, wiring-audit]
    if: always()

    steps:
    - name: Check all jobs passed
      run: |
        if [ "${{ needs.lint.result }}" != "success" ] || \
           [ "${{ needs.type-check.result }}" != "success" ] || \
           [ "${{ needs.security.result }}" != "success" ] || \
           [ "${{ needs.docs-build.result }}" != "success" ] || \
           [ "${{ needs.test.result }}" != "success" ] || \
           [ "${{ needs.wiring-audit.result }}" != "success" ]; then
          echo "❌ One or more CI jobs failed"
          exit 1
        else
          echo "✅ All CI jobs passed successfully"
        fi
